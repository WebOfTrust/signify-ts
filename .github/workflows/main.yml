name: Run Tests
on:
  push:
    branches:
      - 'main'
      - 'development'
  pull_request:
    branches:
      - 'main'
      - 'development'
  workflow_dispatch:
jobs:
  build:
    name: Build, lint, and test on Node ${{ matrix.node-version }} and ${{ matrix.os }}

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macOS-latest, ubuntu-latest]
        node-version: ['20', '22', '24']

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm cache clean --force
          npm set registry https://registry.npmjs.org/
          npm ci

      - name: Check formatting
        run: npm run pretty:check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test -- --coverage=true

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  test:
    name: Run integration test using ${{ matrix.keria-image }}:${{ matrix.keria-version }} and auth-mode ${{ matrix.auth-mode }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - keria-image: gleif/keria
            keria-version: '0.4.1-dev1'
            node-version: '20'
            auth-mode: signed-headers
          - keria-image: gleif/keria
            keria-version: '0.4.1-dev1'
            node-version: '20'
            auth-mode: essr
    env:
      KERIA_IMAGE: ${{ matrix.keria-image }}
      KERIA_IMAGE_TAG: ${{ matrix.keria-version }}
      TEST_AUTH_MODE: ${{ matrix.auth-mode }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: install deps
        run: npm ci
      - name: Build
        run: npm run build
      - name: Print docker compose config
        run: docker compose config
      - name: Start dependencies
        run: docker compose up --wait --pull always
      - name: Run integration test
        run: npm run test:integration
      - name: Print logs
        run: docker compose logs
        if: always()
